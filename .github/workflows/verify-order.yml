name: Verify bisht order flow

on:
  push:
    paths:
      - ".github/workflows/verify-order.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Send controlled bisht test order
        shell: bash
        run: |
          set -euo pipefail
          payload='{"transactionId":"BISHT-VERIFY-20261002","product":"بشت التميز الملكي","name":"VERIFY_BISHT_ORDER","phone":"0500000000","address":"TEST - DO NOT FULFILL","offerCode":1,"offer":"بشت واحد","price":399,"country":"SA","sku":"MULTI-COLLAGEN","currency":"SAR","pageUrl":"https://xcore-fit.github.io/?verify=bisht","source":"XCORE FIT Bisht Landing Page","utm":{"utm_source":"xcorefit-bisht","utm_medium":"399","utm_campaign":"بشت التميز الملكي","utm_term":"1-bisht","utm_content":"xcore-fit.github.io"}}'
          curl --fail --location --silent --show-error             -H 'Content-Type: text/plain;charset=utf-8'             --data "$payload"             'https://script.google.com/macros/s/AKfycbxxBGHE4mZ5iDdplvvaFxVhrHoOMETyRoafgk8iG-DGx9vhY27JgFhc3VHFBO22hu4x0w/exec'             -o /tmp/body.json
          cat /tmp/body.json
          grep -q '"ok":true' /tmp/body.json
